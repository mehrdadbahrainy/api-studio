name: Windows native vault acceptance

on:
  push:
    branches: ['test/windows-native-vault-acceptance']
  pull_request:
    branches: [main]
    paths:
      - 'tests/desktop/**'
      - '.github/workflows/native-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-windows-acceptance:
    name: Installed MSI + native WebView2 vault E2E
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Install test harness dependencies
        run: npm install --no-audit --no-fund

      - name: Download tested v0.1.1 MSI from the original successful CI run
        uses: actions/download-artifact@v4
        with:
          name: api-studio-windows-installers
          path: downloaded-installers
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43819385278

      - name: Install released MSI and locate installed executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path downloaded-installers -Filter '*.msi' -File -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'No MSI download found' }
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw "MSI installation failed: $($process.ExitCode)" }

          $keys = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                    'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                    'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $installed = Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*API Studio*' } | Select-Object -First 1
          if (-not $installed) { throw 'API Studio installation not registered' }

          $locations = @()
          if ($installed.InstallLocation) { $locations += $installed.InstallLocation }
          $locations += (Join-Path $env:ProgramFiles 'API Studio')
          if (${env:ProgramFiles(x86)}) { $locations += (Join-Path ${env:ProgramFiles(x86)} 'API Studio') }
          $locations += (Join-Path $env:LOCALAPPDATA 'Programs\API Studio')
          $exe = $null
          foreach ($folder in $locations) {
            if (-not (Test-Path $folder)) { continue }
            $exe = Get-ChildItem -Path $folder -File -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch 'unins|uninstall|setup|update' } | Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) { throw "Installed app executable not found. InstallLocation='$($installed.InstallLocation)'" }
          Write-Host "Installed app: $($exe.FullName)"
          "API_STUDIO_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test real installed app and encrypted workspace with Playwright CDP
        shell: pwsh
        run: node tests/desktop/native-smoke.mjs

      - name: Diagnose native process and WebView2 runtime on failed acceptance
        if: failure()
        shell: pwsh
        run: |
          Write-Host 'Windows session:'
          query session 2>&1 | Out-String | Write-Host
          Write-Host 'WebView2 runtime versions:'
          $folder = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          if (Test-Path $folder) { Get-ChildItem $folder -Directory | Select-Object Name | Format-Table | Out-String | Write-Host }
          Write-Host 'Recent application crash records:'
          $events = Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Id -in @(1000,1001,1002) -and ($_.Message -match 'api_studio|WebView2|msedgewebview2|Application Error') } |
            Select-Object -First 8
          foreach ($entry in $events) {
            Write-Host "Event $($entry.Id): $($entry.TimeCreated)"
            Write-Host $entry.Message
          }
          Write-Host 'Test standalone application startup without CDP:'
          if ($env:API_STUDIO_EXE -and (Test-Path $env:API_STUDIO_EXE)) {
            $p = Start-Process -FilePath $env:API_STUDIO_EXE -PassThru
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) { Write-Host "Standalone startup exit code: $($p.ExitCode)" }
            else { Write-Host 'Standalone process remained running for 8 seconds'; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Compare v0.1.0 startup on same runner after a failed native acceptance
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host 'Checking whether the previously released v0.1.0 app also crashes in the same runner environment'
          $newMsi = Get-ChildItem downloaded-installers -Filter '*.msi' -File -Recurse | Select-Object -First 1
          if ($newMsi) {
            $p = Start-Process msiexec.exe -ArgumentList "/x `"$($newMsi.FullName)`" /qn /norestart" -PassThru -Wait
            Write-Host "Uninstall current MSI: $($p.ExitCode)"
          }
          New-Item -ItemType Directory -Force -Path baseline-download | Out-Null
          gh release download v0.1.0 --repo "$env:GITHUB_REPOSITORY" --pattern '*.msi' --dir baseline-download
          $oldMsi = Get-ChildItem baseline-download -Filter '*.msi' -File | Select-Object -First 1
          if ($oldMsi) {
            $p = Start-Process msiexec.exe -ArgumentList "/i `"$($oldMsi.FullName)`" /qn /norestart" -PassThru -Wait
            Write-Host "Install v0.1.0 MSI: $($p.ExitCode)"
            $exe = Join-Path $env:ProgramFiles 'API Studio\api_studio.exe'
            if (Test-Path $exe) {
              $p = Start-Process -FilePath $exe -PassThru
              Start-Sleep -Seconds 8
              $p.Refresh()
              if ($p.HasExited) { Write-Host "BASELINE v0.1.0 STARTUP: crashed/exited, code $($p.ExitCode)" }
              else { Write-Host 'BASELINE v0.1.0 STARTUP: remained running for 8 seconds'; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            }
            $p = Start-Process msiexec.exe -ArgumentList "/x `"$($oldMsi.FullName)`" /qn /norestart" -PassThru -Wait
            Write-Host "Uninstall v0.1.0: $($p.ExitCode)"
          }
      - name: Uninstall MSI after acceptance test
        if: always()
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path downloaded-installers -Filter '*.msi' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $p = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
            Write-Host "MSI uninstall exit code: $($p.ExitCode)"
          }
