name: Publish verified API Studio v0.2.2
on:
  workflow_run:
    workflows: ['CI - install, test, build and desktop packaging']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact tested main commit and version before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$RUN_SHA" || { echo "Not publishing stale main commit"; exit 1; }
          file="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RUN_SHA" --jq '.content' | base64 -d)"
          version="$(echo "$file" | jq -r '.version')"
          if [ "$version" != '0.2.2' ]; then
            echo "Not the v0.2.2 source commit ($version)"
            exit 1
          fi
          if gh release view v0.2.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.2 was already published; no replacement will be attempted'
            exit 0
          fi
          echo "EXACT_SHA=$RUN_SHA" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Verified successful main CI run $RUN_ID for $RUN_SHA"

      - name: Download exact successful CI Windows installers
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name api-studio-windows-installers --dir downloaded

      - name: Verify MSI and EXE asset names, create integrity checksums
        if: env.RUN_ID != ''
        run: |
          set -euo pipefail
          mkdir release-assets
          test "$(find downloaded -type f -iname '*0.2.2*.msi' | wc -l)" -eq 1
          test "$(find downloaded -type f -iname '*0.2.2*.exe' | wc -l)" -eq 1
          find downloaded -type f -iname '*0.2.2*.msi' -exec cp '{}' release-assets/ ';'
          find downloaded -type f -iname '*0.2.2*.exe' -exec cp '{}' release-assets/ ';'
          (cd release-assets && sha256sum -- *.msi *.exe > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Publish tested v0.2.2 Windows release (not a preview)
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          # API Studio v0.2.2 — Windows QA data-integrity and modal safety fixes

          New corrective Windows x64 release based on local v0.2.1 QA. Previously published releases are unchanged.

          ## Fixed after local v0.2.1 testing
          - **P1 saved request integrity:** reject oversized request fields and excess row counts before save, import or restore. Preserve the previous workspace and unsaved edits, never silently truncate an accepted request on reload.
          - **P2 keyboard safety:** dialogs own focus, block background shortcuts (including Ctrl+Enter Send), handle Escape and restore focus on close.
          - Validate browser, Windows CurrentUser DPAPI and passphrase-encrypted writes before persistence; reject malformed request lists and duplicate environment IDs.
          - New boundary, browser and installed Windows MSI/WebView2 regression coverage for both issues.

          ## Existing functionality
          - Multi-request tabs, nested Collection folders, safe request moving and Postman JSON imports.
          - Raw/Formatted JSON/XML/HTML responses; accurate History and full response timing; clear 5 MB response limit diagnostics.
          - Help/About, official source documentation links and GitHub stable update checks without silent installer execution.

          ## Compatibility and limitations
          - Windows x64 only. Keep a **private** JSON backup before upgrading; exported JSON is not encrypted. Windows DPAPI protection belongs to the original Windows user account.
          - Invalid legacy over-limit values now fail validation rather than being silently modified. This does not recover content already truncated by an older release.
          - Native file-picker dialogs, upgrades from a vault produced by a real v0.1.2 install, disk fault injection, exhaustive DPI/accessibility and multi-instance acceptance are still unverified.
          - Installers are unsigned. Windows CI tests on disposable machines cannot guarantee every personal Windows setup.
          - Sequential requests across tabs, binary response export unsupported, network bodies over 5 MB not retained. Unsupported Postman scripts/auth/file uploads not run.

          ## Release integrity
          - The official installer binaries come from the **exact main SHA** that passed all CI gates, including installed MSI native restart and uninstall acceptance.
          - Verify EXE/MSI SHA-256 hashes with SHA256SUMS.txt.
          - QA evidence: https://github.com/mehrdadbahrainy/api-studio/issues/20
          - Source/docs: https://github.com/mehrdadbahrainy/api-studio
          NOTES
          gh release create v0.2.2 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$EXACT_SHA" --title 'API Studio v0.2.2' --notes-file RELEASE_NOTES.md --latest
