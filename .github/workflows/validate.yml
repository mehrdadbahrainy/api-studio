name: CI - install, test, build and desktop packaging
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-build:
    name: Fresh install, unit tests, Angular build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Validate source encodings
        run: python3 scripts/check_encoding.py
      - name: Fresh dependency install
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm run test:core
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build Angular production app
        run: npm run build
      - name: Verify installed output exists
        run: test -f dist/api-studio/browser/index.html && test -f dist/api-studio/browser/assets/lucide.svg
      - uses: actions/upload-artifact@v4
        with:
          name: api-studio-angular-build
          path: dist/api-studio/browser/
          retention-days: 7
  browser-e2e:
    name: Real HTTP E2E in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Fresh dependency install
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright with local API fixture
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  desktop-windows:
    name: Fresh Windows desktop installer build
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Fresh dependency install
        run: npm install --no-audit --no-fund
      - name: Build real installer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: api-studio-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  desktop-install-smoke:
    name: Download MSI artifact and test install/uninstall
    needs: desktop-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-studio-windows-installers
          path: downloaded-installers
      - name: Verify installation and removal on a clean runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path downloaded-installers -Filter '*.msi' -File -Recurse | Select-Object -First 1
          if (-not $msi) { throw 'Downloaded artifact does not contain an MSI installer' }
          $log = Join-Path $env:RUNNER_TEMP 'api-studio-msi.log'
          $args = "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$log`""
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $args -PassThru -Wait
          if ($process.ExitCode -notin @(0,3010)) {
            Get-Content $log -Tail 100
            throw "MSI installation failed: $($process.ExitCode)"
          }
          $keys = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                    'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                    'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          $installed = Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*API Studio*' } | Select-Object -First 1
          if (-not $installed) { throw 'MSI succeeded, but API Studio registration was not found' }
          Write-Host "Installed: $($installed.DisplayName)"
          # A successful MSI return code is not proof that the installed GUI can start.
          $installDirs = @()
          if ($installed.InstallLocation) { $installDirs += $installed.InstallLocation }
          $installDirs += (Join-Path $env:ProgramFiles 'API Studio')
          if (${env:ProgramFiles(x86)}) { $installDirs += (Join-Path ${env:ProgramFiles(x86)} 'API Studio') }
          $binary = $null
          foreach ($directory in $installDirs | Select-Object -Unique) {
            if (Test-Path $directory) {
              $binary = Get-ChildItem $directory -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notmatch 'uninstall|setup|updater' } | Select-Object -First 1
              if ($binary) { break }
            }
          }
          if (-not $binary) { throw 'Installed API Studio executable was not found' }
          Write-Host "Launching installed binary: $($binary.FullName)"
          $desktop = Start-Process -FilePath $binary.FullName -PassThru
          try {
            $windowFound = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              $desktop.Refresh()
              if ($desktop.HasExited) { throw "Installed desktop process exited early with code $($desktop.ExitCode)" }
              if ($desktop.MainWindowHandle -ne 0) { $windowFound = $true; break }
            }
            if (-not $windowFound) { throw 'Installed desktop process has no visible main window after 20 seconds' }
            Write-Host "Native desktop window opened (handle $($desktop.MainWindowHandle))"
          }
          finally {
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue }
          }
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -PassThru -Wait
          if ($process.ExitCode -notin @(0,3010)) { throw "MSI uninstall failed: $($process.ExitCode)" }
