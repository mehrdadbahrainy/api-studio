name: Publish verified API Studio v0.1.1 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.1.1.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish tested Windows v0.1.1 installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm source CI finished successfully on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/43819385278")"
          echo "$details" | jq -e --arg sha 'c1b66bfa3c37d2213bd98e462028b1be658ffcac' '.head_sha == $sha and .head_branch == "main" and .conclusion == "success"' >/dev/null
          echo "Verified complete CI for the exact merged source commit"

      - name: Download Windows installer artifact from verified CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43819385278 --repo "$GITHUB_REPOSITORY" --name api-studio-windows-installers --dir downloaded

      - name: Check installer types and generate SHA-256 checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          msi_count="$(find downloaded -type f -iname '*.msi' | wc -l)"
          exe_count="$(find downloaded -type f -iname '*.exe' | wc -l)"
          test "$msi_count" -eq 1 && test "$exe_count" -eq 1 || { echo "::error::Missing or duplicate MSI/EXE"; exit 1; }
          find downloaded -type f -iname '*.msi' -exec cp -v '{}' release-assets/ ';'
          find downloaded -type f -iname '*.exe' -exec cp -v '{}' release-assets/ ';'
          (cd release-assets && sha256sum -- *.msi *.exe > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Publish permanent preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v0.1.1 release already exists, refusing to overwrite it"
            exit 1
          fi
          cat > RELEASE_NOTES.md <<'NOTES'
          ## API Studio v0.1.1 — Security & Reliability Preview

          ### Changes
          - Stronghold encrypted desktop workspace with Argon2 and a user-chosen passphrase.
          - Migration from v0.1.0 localStorage only after successful encrypted save.
          - Request history redacts credentials, query values, request bodies and sensitive headers.
          - Request cancellation, 30-second timeout, safer error messages and manual update check.

          ### Windows downloads
          - **EXE** — x64 Windows installer
          - **MSI** — x64 Windows Installer package
          - **SHA256SUMS.txt** — integrity checksums

          ### Important before updating
          Export a private backup in v0.1.0 before upgrading. You must create a passphrase of at least 12 characters to unlock the desktop vault. There is no passphrase recovery. JSON exports are unencrypted and may contain tokens.

          ### Quality and limitations
          On the merged main branch, CI passed unit tests, Angular production build, Playwright E2E, Windows installer creation, and MSI installation/uninstallation on a clean Windows runner. Verified CI: https://github.com/mehrdadbahrainy/api-studio/actions/runs/43819385278

          This is an **unsigned preview**; Windows may warn about an unknown publisher. The encrypted vault unlock and v0.1.0 migration have not yet been independently tested in an interactive Windows desktop session. Browser mode remains subject to CORS and stores data unencrypted.

          Source: https://github.com/mehrdadbahrainy/api-studio
          NOTES
          gh release create v0.1.1 release-assets/* --repo "$GITHUB_REPOSITORY" --target 'c1b66bfa3c37d2213bd98e462028b1be658ffcac' --title 'API Studio v0.1.1 (Preview)' --notes-file RELEASE_NOTES.md --prerelease
