name: Publish verified API Studio v0.1.4
on:
  workflow_run:
    workflows: ['CI - install, test, build and desktop packaging']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact tested main commit and version before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$RUN_SHA" || { echo "Not publishing stale main commit"; exit 1; }
          file="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RUN_SHA" --jq '.content' | base64 -d)"
          version="$(echo "$file" | jq -r '.version')"
          if [ "$version" != '0.1.4' ]; then
            echo "Not the v0.1.4 source commit ($version)"
            exit 1
          fi
          if gh release view v0.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.1.4 was already published; no replacement will be attempted'
            exit 0
          fi
          echo "EXACT_SHA=$RUN_SHA" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Verified successful main CI run $RUN_ID for $RUN_SHA"

      - name: Download exact successful CI Windows installers
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name api-studio-windows-installers --dir downloaded

      - name: Verify MSI and EXE asset names, create integrity checksums
        if: env.RUN_ID != ''
        run: |
          set -euo pipefail
          mkdir release-assets
          test "$(find downloaded -type f -iname '*0.1.4*.msi' | wc -l)" -eq 1
          test "$(find downloaded -type f -iname '*0.1.4*.exe' | wc -l)" -eq 1
          find downloaded -type f -iname '*0.1.4*.msi' -exec cp '{}' release-assets/ ';'
          find downloaded -type f -iname '*0.1.4*.exe' -exec cp '{}' release-assets/ ';'
          (cd release-assets && sha256sum -- *.msi *.exe > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Publish tested v0.1.4 Windows release (not a preview)
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          # API Studio v0.1.4 — Workspace navigation and visual polish

          ## What's new
          - Expand and collapse individual Collections, including Postman-imported Collections, with accessible disclosure controls.
          - Expand or collapse all Collections; search automatically reveals matching Requests without discarding a Collection's collapsed preference.
          - Resize the sidebar by dragging its edge (228–480 px) or using Arrow/Home/End keys.
          - Collapse the sidebar to a compact 68 px navigation rail; restore it through the toggle or Collections/History tabs.
          - Persist UI-only layout preferences across launches without writing sensitive workspace content or access tokens to those preferences.
          - Align Lucide icons centrally in toolbar and action buttons; improve spacing, hierarchy, contrast, active request states, and responsive layout.

          ## Existing behavior preserved
          - Postman Collection v2.0/v2.1 and Environment JSON import remains additive and non-destructive.
          - Windows CurrentUser DPAPI still protects the passwordless desktop workspace. An optional user-chosen app passphrase remains available.
          - Upgrading from a v0.1.2 passphrase vault still requires the original passphrase once. Keep private JSON backups before changing Windows account or device.

          ## Known limitations
          - Some Postman scripts, advanced auth schemes and file-upload fields are not imported or executed.
          - Workspace JSON exports are unencrypted and may contain secrets. Keep them private.
          - Windows CurrentUser DPAPI is tied to your Windows account/profile and is not a portable backup.
          - Installers are unsigned; SmartScreen may show an unverified publisher warning.
          - Script-free API Scenario Runner and Git-friendly CLI/JUnit integration remain future roadmap milestones.

          ## Verification
          - Unit tests and TypeScript/Angular production checks.
          - Chromium E2E including Collection disclosure, resizable and compact sidebar, icon alignment, mobile layout, Postman import and HTTP workflows.
          - Windows Server 2025 native startup, installed MSI/WebView2 data migration, restart and uninstall gates.
          - CI success cannot guarantee absence of bugs on every Windows configuration.

          Download the Windows x64 EXE or MSI and verify its SHA-256 hash against SHA256SUMS.txt.
          Source and documentation: https://github.com/mehrdadbahrainy/api-studio
          NOTES
          gh release create v0.1.4 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$EXACT_SHA" --title 'API Studio v0.1.4' --notes-file RELEASE_NOTES.md --latest
