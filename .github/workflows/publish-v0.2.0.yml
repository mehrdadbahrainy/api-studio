name: Publish verified API Studio v0.2.0
on:
  workflow_run:
    workflows: ['CI - install, test, build and desktop packaging']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact tested main commit and version before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$RUN_SHA" || { echo "Not publishing stale main commit"; exit 1; }
          file="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RUN_SHA" --jq '.content' | base64 -d)"
          version="$(echo "$file" | jq -r '.version')"
          if [ "$version" != '0.2.0' ]; then
            echo "Not the v0.2.0 source commit ($version)"
            exit 1
          fi
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.0 was already published; no replacement will be attempted'
            exit 0
          fi
          echo "EXACT_SHA=$RUN_SHA" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Verified successful main CI run $RUN_ID for $RUN_SHA"

      - name: Download exact successful CI Windows installers
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name api-studio-windows-installers --dir downloaded

      - name: Verify MSI and EXE asset names, create integrity checksums
        if: env.RUN_ID != ''
        run: |
          set -euo pipefail
          mkdir release-assets
          test "$(find downloaded -type f -iname '*0.2.0*.msi' | wc -l)" -eq 1
          test "$(find downloaded -type f -iname '*0.2.0*.exe' | wc -l)" -eq 1
          find downloaded -type f -iname '*0.2.0*.msi' -exec cp '{}' release-assets/ ';'
          find downloaded -type f -iname '*0.2.0*.exe' -exec cp '{}' release-assets/ ';'
          (cd release-assets && sha256sum -- *.msi *.exe > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Publish tested v0.2.0 Windows release (not a preview)
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          # API Studio v0.2.0 — Request workspace productivity

          ## What's new
          - Open multiple request tabs. Preserve independent drafts/responses, mark unsaved changes, and choose Save, Discard or Keep Editing before closing tabs.
          - Restore previously open saved request tabs after restarting; UI-only preferences contain request IDs, not secrets.
          - Organize Collections under nested folders and move requests by selecting another Collection and saving. Existing workspace v1 backups remain compatible.
          - Inspect raw or formatted JSON, XML and HTML responses, copy the full response or save plaintext response files. Markup is displayed as text and never executed.
          - In-app Help & About links to the GitHub source, English README, Persian guide, changelog, issues and license.
          - Manual and desktop-startup GitHub stable-release checks, plus a visible update announcement. Updates open the official release page; there is no silent download or installation.
          - Use the system browser for approved project URLs via Tauri Opener.

          ## Compatibility and security
          - Windows x64 only. Windows CurrentUser DPAPI protects the passwordless desktop workspace; optional app passphrase remains available.
          - Data and collections from previous versions are preserved. Export a private backup before upgrading or switching Windows accounts; JSON exports are unencrypted.
          - Postman v2.0/v2.1 Collection/Environment imports remain additive. Scripts and some advanced auth/file-upload features are not executed or supported.
          - XML/HTML formatted view is inert text, not a live browser preview. Network response bodies larger than 5 MB are not stored by the client.
          - Installers are unsigned and Windows SmartScreen may show an unknown-publisher warning.
          - Script-free API Scenario Runner, Git-friendly CLI and JUnit integration remain planned later, not part of v0.2.0.

          ## Quality gates
          - TypeScript, unit tests, Angular build, real HTTP Chromium E2E, Windows installer build and installed MSI WebView2 migration/restart/uninstall acceptance.
          - Published installer assets are taken from the exact final main commit that passed all required checks.
          - Automated testing does not guarantee compatibility with every Windows configuration.

          Download EXE or MSI and compare SHA-256 hashes with SHA256SUMS.txt.
          Source, help and documentation: https://github.com/mehrdadbahrainy/api-studio
          NOTES
          gh release create v0.2.0 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$EXACT_SHA" --title 'API Studio v0.2.0' --notes-file RELEASE_NOTES.md --latest
