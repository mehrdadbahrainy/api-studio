name: Publish verified API Studio v0.2.1
on:
  workflow_run:
    workflows: ['CI - install, test, build and desktop packaging']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact tested main commit and version before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$RUN_SHA" || { echo "Not publishing stale main commit"; exit 1; }
          file="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RUN_SHA" --jq '.content' | base64 -d)"
          version="$(echo "$file" | jq -r '.version')"
          if [ "$version" != '0.2.1' ]; then
            echo "Not the v0.2.1 source commit ($version)"
            exit 1
          fi
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.1 was already published; no replacement will be attempted'
            exit 0
          fi
          echo "EXACT_SHA=$RUN_SHA" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Verified successful main CI run $RUN_ID for $RUN_SHA"

      - name: Download exact successful CI Windows installers
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name api-studio-windows-installers --dir downloaded

      - name: Verify MSI and EXE asset names, create integrity checksums
        if: env.RUN_ID != ''
        run: |
          set -euo pipefail
          mkdir release-assets
          test "$(find downloaded -type f -iname '*0.2.1*.msi' | wc -l)" -eq 1
          test "$(find downloaded -type f -iname '*0.2.1*.exe' | wc -l)" -eq 1
          find downloaded -type f -iname '*0.2.1*.msi' -exec cp '{}' release-assets/ ';'
          find downloaded -type f -iname '*0.2.1*.exe' -exec cp '{}' release-assets/ ';'
          (cd release-assets && sha256sum -- *.msi *.exe > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Publish tested v0.2.1 Windows release (not a preview)
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          # API Studio v0.2.1 — Windows QA fixes

          This is a corrective release for Windows users of API Studio v0.2.0.
          The original v0.2.0 tag and installers remain unchanged.

          ## Fixed
          - **Workspace data integrity (P1):** oversized/duplicate-ID workspace backups fail validation instead of silently truncating Collections, environments, or creating ambiguous saved requests. Saved-request capacity is separate from History.
          - **Request timing (P2):** response duration now includes the full response-body download.
          - **Oversized response messaging (P2):** a response exceeding the 5 MB transport limit shows the accurate limitation, not an unavailable binary download.
          - **History request snapshot (P2):** History records the URL and data actually sent even if the open editor changes during the request.

          ## Existing v0.2.0 features retained
          - Multi-request tabs with dirty indicators, safe close and saved-tab restart.
          - Nested Collection folders, Postman Collection/Environment JSON import, moving saved requests.
          - Raw/Formatted JSON/XML/HTML inspection, Copy and Save Response.
          - Help/About, source/documentation links and manual/startup stable GitHub update checks (no silent installation).

          ## Compatibility and known limitations
          - Windows x64 only. Windows CurrentUser DPAPI protects the default workspace; optional application passphrase remains available. Keep a private unencrypted JSON backup before upgrading, especially when changing Windows accounts.
          - Original v0.2.0 remains available for reproducibility, but new installations should use v0.2.1.
          - Windows installers are unsigned; SmartScreen might show an unknown publisher.
          - API requests are executed sequentially across tabs. Responses above 5 MB are not retained; binary response export is not supported.
          - Postman scripts and advanced unsupported auth/file upload features are not executed. Native OS file-picker workflows, migration from a vault produced by actual v0.1.2 software, exhaustive fault injection and accessibility/DPI audits have not been fully accepted.
          - Tests do not guarantee compatibility on every Windows machine.

          ## Release verification
          - The exact final main commit passed unit/Angular, HTTP Chromium E2E, Windows installer compilation and genuine installed MSI/WebView2 acceptance on a disposable runner.
          - This release uses installers downloaded from that exact passing CI run. Verify file integrity with SHA256SUMS.txt.
          - QA report: https://github.com/mehrdadbahrainy/api-studio/issues/20
          - Source and documentation: https://github.com/mehrdadbahrainy/api-studio
          NOTES
          gh release create v0.2.1 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$EXACT_SHA" --title 'API Studio v0.2.1' --notes-file RELEASE_NOTES.md --latest
