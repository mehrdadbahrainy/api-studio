name: Publish verified API Studio v0.1.2
on:
  workflow_run:
    workflows: ['CI - install, test, build and desktop packaging']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact tested main commit and version before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$RUN_SHA" || { echo "Not publishing stale main commit"; exit 1; }
          file="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RUN_SHA" --jq '.content' | base64 -d)"
          version="$(echo "$file" | jq -r '.version')"
          if [ "$version" != '0.1.2' ]; then
            echo "Skipping historical v0.1.2 publication because main now has version $version"
            exit 0
          fi
          if gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.1.2 was already published; no replacement will be attempted'
            exit 0
          fi
          echo "EXACT_SHA=$RUN_SHA" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Verified successful main CI run $RUN_ID for $RUN_SHA"

      - name: Download exact successful CI Windows installers
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name api-studio-windows-installers --dir downloaded

      - name: Verify MSI and EXE asset names, create integrity checksums
        if: env.RUN_ID != ''
        run: |
          set -euo pipefail
          mkdir release-assets
          test "$(find downloaded -type f -iname '*0.1.2*.msi' | wc -l)" -eq 1
          test "$(find downloaded -type f -iname '*0.1.2*.exe' | wc -l)" -eq 1
          find downloaded -type f -iname '*0.1.2*.msi' -exec cp '{}' release-assets/ ';'
          find downloaded -type f -iname '*0.1.2*.exe' -exec cp '{}' release-assets/ ';'
          (cd release-assets && sha256sum -- *.msi *.exe > SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Publish tested v0.1.2 Windows release (not a preview)
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          # API Studio v0.1.2 — Windows reliability release

          This release replaces the **broken v0.1.1 preview**. Do not install the v0.1.1 preview for new work.

          ## Fixes
          - Fix Windows startup crash associated with native Stronghold initialization.
          - Encrypt desktop workspace with Web Crypto PBKDF2-SHA256 (600,000 iterations) and AES-256-GCM; persist only encrypted data using Tauri native commands.
          - Verify encrypted writes before deleting v0.1.0 plaintext during migration.
          - Preserve existing v0.1.1 Stronghold snapshots without silently replacing them.
          - Prevent local paths and sensitive native errors from appearing in the vault UI.
          - Keep sanitized history, request timeout/cancellation and manual release checks.

          ## Compatibility and security
          - **v0.1.1 Stronghold data cannot be automatically migrated.** If you already created a v0.1.1 vault, its files are preserved and v0.1.2 will not overwrite them. Export a private JSON backup from a working old install before using v0.1.2, or preserve your AppData files for future recovery.
          - Existing v0.1.0 localStorage data migrates after verified encrypted save. Export a private backup before upgrading.
          - Passphrase is at least 12 characters and cannot be recovered.
          - JSON exports are **not encrypted**. Browser-only mode also stores data unencrypted and is subject to CORS.
          - Windows installers are unsigned; SmartScreen may warn about an unverified publisher.

          ## Test gates
          - Unit tests, TypeScript check, production Angular build, and Chromium HTTP E2E.
          - Windows Server 2025 desktop process startup; clean MSI installation, native WebView2 acceptance covering migration, save/restart, wrong-passphrase and redacted history; MSI uninstall.
          - Tests were run on hosted CI runners. A claim of zero bugs on every Windows device is not possible.

          Download the x64 EXE or MSI below, and use SHA256SUMS.txt to verify the downloaded file.
          Source and detailed instructions: https://github.com/mehrdadbahrainy/api-studio
          NOTES
          gh release create v0.1.2 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$EXACT_SHA" --title 'API Studio v0.1.2' --notes-file RELEASE_NOTES.md --latest
